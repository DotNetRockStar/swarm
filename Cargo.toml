[workspace]
resolver = "2"
members = [
    "crates/swarm-core",
    "crates/swarm-p2p",
    "crates/swarm-media",
    "crates/swarm-stun-client",
    "apps/stun-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/Jerrod/swarm"

[workspace.dependencies]
swarm-core = { path = "crates/swarm-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
thiserror = "2"
