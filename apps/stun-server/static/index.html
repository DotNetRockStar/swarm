<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SWARM</title>
<link rel="icon" type="image/png" href="badge.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --swarm-bg: #101828;
  --swarm-surface: #151f32;
  --swarm-surface-muted: #1f2a44;
  --swarm-border: #31405f;
  --swarm-accent: #00c2ff;
  --swarm-accent-hot: #ff3ea5;
  --swarm-green: #34d399;
  --swarm-text: #ecf6ff;
  --swarm-muted: #9fb0c9;
}
body {
  background: var(--swarm-bg);
  color: var(--swarm-text);
  font-family: "Nunito", system-ui, sans-serif;
  min-height: 100vh;
  background-image:
    linear-gradient(rgba(0,194,255,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,194,255,.04) 1px, transparent 1px);
  background-size: 42px 42px;
}
.card { background: var(--swarm-surface); border: 1px solid var(--swarm-border); }
.card-header { background: var(--swarm-surface-muted); border-bottom: 1px solid var(--swarm-border); font-weight: 700; }
.navbar { background: #0b1020; border-bottom: 2px solid var(--swarm-border); }
.brand-mark {
  width: 34px; height: 34px; object-fit: contain;
  filter: drop-shadow(0 0 6px rgba(0,194,255,.5));
  display: inline-block;
}
.brand-title { font-weight: 800; letter-spacing: .12em; color: var(--swarm-text); }
.btn-swarm { background: var(--swarm-accent); border: none; color: #04263a; font-weight: 700; }
.btn-swarm:hover { background: #4fd6ff; color: #04263a; }
.text-muted, .form-text { color: var(--swarm-muted) !important; }
.table { --bs-table-bg: transparent; }
.badge-online { background: var(--swarm-green); color: #062b1d; }
.badge-offline { background: var(--swarm-surface-muted); color: var(--swarm-muted); border: 1px solid var(--swarm-border); }
.code-display {
  font-family: ui-monospace, monospace; font-size: 2.4rem; letter-spacing: .35em;
  color: var(--swarm-accent); text-align: center; font-weight: 800;
}
.fingerprint { font-family: ui-monospace, monospace; font-size: .78rem; color: var(--swarm-muted); }
a { color: var(--swarm-accent); }
</style>
</head>
<body>
<nav class="navbar px-3 mb-4">
  <span class="navbar-brand d-flex align-items-center gap-2">
    <img class="brand-mark" src="badge.png" alt="SWARM">
    <span class="brand-title">SWARM</span>
    <span class="badge text-bg-dark border">STUN</span>
  </span>
  <span id="navRight" class="d-flex align-items-center gap-3 d-none">
    <a href="/api/docs" target="_blank" title="API docs"><i class="bi bi-braces"></i></a>
    <span id="navEmail" class="text-muted small"></span>
    <button id="logoutBtn" class="btn btn-sm btn-outline-light">Sign out</button>
  </span>
</nav>
<main class="container" style="max-width: 1000px">
  <div id="alerts"></div>

  <!-- Auth view -->
  <div id="authView" class="d-none row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card">
        <div class="card-header">
          <ul class="nav nav-tabs card-header-tabs" id="authTabs">
            <li class="nav-item"><button class="nav-link active" data-tab="login">Sign in</button></li>
            <li class="nav-item"><button class="nav-link" data-tab="register">Create account</button></li>
          </ul>
        </div>
        <div class="card-body">
          <form id="authForm">
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" id="authEmail" required autocomplete="username">
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" id="authPassword" required minlength="10" autocomplete="current-password">
              <div class="form-text" id="authHint"></div>
            </div>
            <button class="btn btn-swarm w-100" id="authSubmit">Sign in</button>
          </form>
          <div class="mt-3 text-center">
            <a href="#" id="forgotLink" class="small">Forgot password?</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Dashboard view -->
  <div id="dashView" class="d-none">
    <div class="card mb-4">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span><i class="bi bi-diagram-3 me-2"></i>Your swarms</span>
        <form id="createSwarmForm" class="d-flex gap-2">
          <input class="form-control form-control-sm" id="newSwarmName" placeholder="New swarm name" maxlength="64" required>
          <button class="btn btn-sm btn-swarm text-nowrap">Create</button>
        </form>
      </div>
      <div class="card-body p-0"><div id="swarmList" class="p-3 text-muted">Loading…</div></div>
    </div>
    <div class="card mb-4">
      <div class="card-header"><i class="bi bi-hdd-stack me-2"></i>Your devices</div>
      <div class="card-body p-0"><div id="deviceList" class="p-3 text-muted">Loading…</div></div>
    </div>
    <div class="card mb-5">
      <div class="card-header"><i class="bi bi-person-gear me-2"></i>Account</div>
      <div class="card-body">
        <form id="passwordForm" class="row g-2 align-items-end" style="max-width: 640px">
          <div class="col-sm-5">
            <label class="form-label small">Current password</label>
            <input type="password" class="form-control form-control-sm" id="curPassword" required autocomplete="current-password">
          </div>
          <div class="col-sm-5">
            <label class="form-label small">New password</label>
            <input type="password" class="form-control form-control-sm" id="newPassword" required minlength="10" autocomplete="new-password">
          </div>
          <div class="col-sm-2">
            <button class="btn btn-sm btn-outline-light w-100">Change</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</main>

<!-- Join-code modal -->
<div class="modal fade" id="codeModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="background: var(--swarm-surface); border: 1px solid var(--swarm-border)">
      <div class="modal-header border-0">
        <h5 class="modal-title">Join code for <span id="codeSwarmName"></span></h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="code-display" id="codeValue"></div>
        <p class="text-muted text-center mt-3 mb-0">
          Enter this on the device you want to add. Single use, expires <span id="codeExpiry"></span>.
        </p>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
