[package]
name = "swarm-server"
description = "SWARM media server: library engine + peer QUIC serving. Headless daemon (swarm-serverd) plus the Tauri desktop shell (swarm-server-app)."
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "swarm-serverd"

[[bin]]
name = "swarm-serverd"
path = "src/main.rs"

[[bin]]
name = "swarm-server-app"
path = "src/gui.rs"
required-features = ["gui"]

[features]
default = []
# rmcp/axum/schemars back the read-only MCP server (see src/mcp.rs) — GUI-only,
# same as tauri itself: it's started from AppState::core alongside the Tauri
# app's ServerCore, reading the same settings.json toggle/port the dashboard's
# AI tab writes. The headless daemon (swarm-serverd) has no settings.json
# story at all (env-var configured, see config_from_env), so there's nothing
# for it to read to decide whether to start one — not worth carrying the
# dependency weight there for a feature it could never turn on.
gui = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:rmcp", "dep:axum", "dep:schemars"]

[dependencies]
swarm-core = { workspace = true }
swarm-p2p = { path = "../../crates/swarm-p2p" }
swarm-media = { path = "../../crates/swarm-media" }
swarm-stun-client = { path = "../../crates/swarm-stun-client" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
quinn = { workspace = true }
reqwest = { workspace = true }
tauri = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
rmcp = { version = "3", features = ["transport-streamable-http-server"], optional = true }
axum = { version = "0.8", optional = true }
schemars = { version = "1", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true }

[dev-dependencies]
sha2 = { workspace = true }
stun-server = { path = "../stun-server" }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }
axum = "0.8"
