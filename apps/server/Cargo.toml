[package]
name = "swarm-server"
description = "SWARM media server: library engine + peer QUIC serving. Headless daemon today; the Tauri desktop shell wraps this core."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "swarm-serverd"
path = "src/main.rs"

[dependencies]
swarm-core = { workspace = true }
swarm-p2p = { path = "../../crates/swarm-p2p" }
swarm-media = { path = "../../crates/swarm-media" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
